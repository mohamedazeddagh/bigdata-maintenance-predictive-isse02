version: '3.8'

services:
  # ==========================================
  # 1. INGESTION TEMPS RÉEL (Module 1 : Kafka)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: isse02-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bigdata-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: isse02-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bigdata-net

  # ==========================================
  # 2. STOCKAGE LAKEHOUSE S3 (Module 2 : MinIO)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: isse02-minio
    ports:
      - "9000:9000"   # API S3 (pour Spark & Hudi)
      - "9001:9001"   # Console Web UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - bigdata-net

  # ==========================================
  # 3. TRAITEMENT & ML (Module 3 : Apache Spark)
  # ==========================================
  spark-master:
    image: apache/spark:3.5.0-python3
    container_name: isse02-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"
    volumes:
      - ./3-processing-spark-ml:/opt/spark/work-dir/scripts
      - ./data:/opt/spark/work-dir/data
    networks:
      - bigdata-net

  spark-worker:
    image: apache/spark:3.5.0-python3
    container_name: isse02-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
    volumes:
      - ./3-processing-spark-ml:/opt/spark/work-dir/scripts
      - ./data:/opt/spark/work-dir/data
    networks:
      - bigdata-net

  # ==========================================
  # 4. ORCHESTRATION & BI (Module 4 : Airflow & Grafana)
  # ==========================================
  airflow:
    image: apache/airflow:2.8.1
    container_name: isse02-airflow
    ports:
      - "8081:8080"   # Airflow Web UI (port 8081 pour éviter conflit avec Spark)
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: standalone
    volumes:
      - ./4-orchestration-airflow:/opt/airflow/dags
    networks:
      - bigdata-net

  grafana:
    image: grafana/grafana:latest
    container_name: isse02-grafana
    ports:
      - "3000:3000"   # Grafana Dashboard UI
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - bigdata-net

networks:
  bigdata-net:
    driver: bridge

volumes:
  minio_data:
  grafana_data: